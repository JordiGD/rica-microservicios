spring:
  datasource:
    url: jdbc:h2:mem:rica;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  grpc:
    server:
      port: 0

server:
  port: 0

eureka:
  client:
    enabled: false
